# Hexo Configuratil
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: '小黑de空间'
subtitle: '没有一个冬天不可逾越，没有一个春天不会来临。最慢的步伐不是跬步，而是徘徊，最快的脚步不是冲刺，而是坚持。'
description: 'Welcome to my Blog🥝'
keywords: 'yjj'
author: '星霜深风'
language: 'zh-CN'
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog-8e6.pages.dev # 绑定自定义域后改这里，然后 git push 触发重建
# ⚠️ permalink 依赖文章 front-matter 的 date，而 date 又依赖文章的显式声明。
# 若某篇文章没写 date，Hexo 会回退使用文件修改时间(mtime)，
# 导致备份、解压、编辑器触碰文件后文章 URL 静默改变、产生死链。
# 因此：每篇文章的 front-matter 必须显式写 date。
# hexo new 生成的脚手架已自带 date，手动新建文件时请自行补上。
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true # 开启后 hexo new 会为每篇文章生成同名资源目录，配图用 {% asset_img %}
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 'mtime' 会让"最后更新"跟随文件被触碰的时间，覆盖文章显式声明的 updated，
## 导致备份、解压、编辑器保存后凭空出现"更新于 <当天>"，且不可复现。
## 'empty' 表示：文章写了 updated 就用文章的值，没写就不显示更新时间。
updated_option: 'empty'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# 改用 GitHub + Cloudflare Pages 自动构建后，原有 Gitee 部署已停用。
# 如需恢复，请先安装 hexo-deployer-git 并取消下面的注释。
# deploy:
#   type: 'git'
#   repo: https://gitee.com/yin-junjie7549/yin-junjie.git
#   branch: master
